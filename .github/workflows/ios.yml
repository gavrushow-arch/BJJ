name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          echo "BJJ_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Build and run XCTest
        run: |
          xcodebuild test \
            -project AvagbeChampsAdmin.xcodeproj \
            -scheme AvagbeChampsAdmin \
            -destination "platform=iOS Simulator,id=$BJJ_SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ios-results.xcresult
      - name: Export native UI review screenshots
        if: success()
        run: xcrun xcresulttool export attachments --path ios-results.xcresult --output-path ui-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ios-results.xcresult
            ui-previews
